<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills - Lakshay Arora</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #000;
            color: #fff;
        }

        header {
            background: #000;
            padding: 20px 0;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            transition: .3s;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #f7b731;
        }

        /* ================= SKILLS PAGE ================= */

        .skills {
            padding: 100px 0;
        }

        .skills h1 {
            font-size: 55px;
            text-align: center;
            margin-bottom: 15px;
        }

        .skills p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 60px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }

        .skill-box {
            background: #111;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #222;
            transition: .3s;
        }

        .skill-box:hover {
            border-color: #f7b731;
            transform: translateY(-5px);
        }

        .skill-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: #222;
            border-radius: 50px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: #f7b731;
            border-radius: 50px;
        }

        /* Responsive */

        @media(max-width:900px) {

            .skills-grid {
                grid-template-columns: 1fr;
            }

            nav ul {
                display: none;
            }

            .skills h1 {
                font-size: 40px;
            }

        }
    </style>

</head>

<body>

    <header>

        <div class="container">

            <nav>

                <div class="logo">
                    LAKSHAY
                </div>

                <ul>

                    <li><a href="index.html">Home</a></li>

                    <li><a href="about.html">About</a></li>

                    <li><a href="resume.html">Resume</a></li>

                    <li><a href="services.html">Services</a></li>

                    <li><a href="skills.html" class="active">Skills</a></li>

                    <li><a href="projects.html">Projects</a></li>

                    <li><a href="blog.html">My Blog</a></li>

                    <li><a href="contact.html">Contact</a></li>

                </ul>

            </nav>

        </div>

    </header>

    <section class="skills">

        <div class="container">

            <h1>My Skills</h1>

            <p class="subtitle">
                I have experience in web development, programming languages, and modern frontend technologies.
            </p>

            <div class="skills-grid">

                <div class="skill-box">

                    <div class="skill-title">

                        <span>HTML</span>
                        <span>95%</span>

                    </div>

                    <div class="progress">
                        <div class="bar" style="width:95%"></div>
                    </div>

                </div>

                <div class="skill-box">

                    <div class="skill-title">

                        <span>CSS</span>
                        <span>90%</span>

                    </div>

                    <div class="progress">
                        <div class="bar" style="width:90%"></div>
                    </div>

                </div>

                <div class="skill-box">

                    <div class="skill-title">

                        <span>JavaScript</span>
                        <span>85%</span>

                    </div>

                    <div class="progress">
                        <div class="bar" style="width:85%"></div>
                    </div>

                </div>

                <div class="skill-box">

                    <div class="skill-title">

                        <span>Java</span>
                        <span>80%</span>

                    </div>

                    <div class="progress">
                        <div class="bar" style="width:80%"></div>
                    </div>

                </div>

                <div class="skill-box">

                    <div class="skill-title">

                        <span>Python</span>
                        <span>75%</span>

                    </div>

                    <div class="progress">
                        <div class="bar" style="width:75%"></div>
                    </div>

                </div>

                <div class="skill-box">

                    <div class="skill-title">

                        <span>SQL</span>
                        <span>70%</span>

                    </div>

                    <div class="progress">
                        <div class="bar" style="width:70%"></div>
                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
